<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Higher or Lower: Guess the Bigger Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120d1f; --card:#1e1733; --card2:#271d44; --ink:#f6f2ff; --mute:#a99cc9;
    --hi:#ff6b3d; --lo:#3dc8ff; --good:#33d17a; --bad:#ff4d6d; --gold:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--ink);
    background-image:radial-gradient(circle at 15% 0%,#3b1f6b 0,transparent 45%),radial-gradient(circle at 100% 100%,#5a1f3d 0,transparent 45%);
    background-attachment:fixed;display:flex;justify-content:center;
  }
  .app{width:100%;max-width:460px;min-height:100%;padding:20px 16px 28px;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  h1{font-size:44px;line-height:.95;font-weight:800;letter-spacing:-1.5px;text-align:center;margin:18px 0 8px}
  h1 .h{color:var(--hi)} h1 .l{color:var(--lo)}
  .tag{text-align:center;color:var(--mute);font-size:16px;margin-bottom:26px}
  .cats{display:grid;gap:12px}
  .cat{
    display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid #ffffff14;
    background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .12s,background .2s;
  }
  .cat:active{transform:scale(.97)} .cat:hover{background:var(--card2)}
  .cat .e{font-size:34px;width:48px;text-align:center}
  .cat b{display:block;font-size:19px;font-weight:700}
  .cat small{color:var(--mute);font-size:14px}
  .cat .best{margin-left:auto;font-size:13px;color:var(--gold);white-space:nowrap}
  .foot{margin-top:auto;padding-top:22px;text-align:center;color:var(--mute);font-size:12px}

  /* game */
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .back{background:none;border:0;color:var(--mute);font:inherit;font-size:15px;cursor:pointer;padding:6px 0}
  .scores{display:flex;gap:14px;font-size:15px;color:var(--mute)}
  .scores b{color:var(--ink);font-size:20px}
  .stage{flex:1;display:flex;flex-direction:column;gap:12px;position:relative}
  .card{
    flex:1;min-height:200px;border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:var(--card);border:1px solid #ffffff12;position:relative;overflow:hidden;transition:background .25s,border-color .25s;
  }
  .card .emo{font-size:58px;line-height:1;margin-bottom:10px}
  .card .name{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.4px}
  .card .sub{color:var(--mute);font-size:14px;margin-top:6px}
  .card .val{font-size:34px;font-weight:800;margin-top:10px;color:var(--gold);letter-spacing:-.5px;min-height:40px}
  .card.good{background:#163a2a;border-color:var(--good)}
  .card.bad{background:#3d1624;border-color:var(--bad)}
  .vs{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:54px;height:54px;border-radius:50%;
    background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 0 0 6px var(--bg);transition:background .25s,transform .25s;
  }
  .vs.good{background:var(--good);transform:translate(-50%,-50%) scale(1.15)}
  .vs.bad{background:var(--bad);transform:translate(-50%,-50%) scale(1.15)}
  .q{font-size:15px;color:var(--mute);margin:8px 0 12px}
  .btns{display:flex;gap:10px;width:100%;max-width:320px}
  .btn{
    flex:1;padding:14px 10px;border-radius:14px;border:0;font:inherit;font-size:18px;font-weight:800;cursor:pointer;color:#fff;transition:transform .1s,opacity .2s;
  }
  .btn:active{transform:scale(.95)}
  .btn.h{background:var(--hi)} .btn.l{background:var(--lo);color:#06222e}
  .btn:disabled{opacity:.35}
  .slide-in{animation:slideIn .35s ease-out}
  @keyframes slideIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .pop{animation:pop .4s ease-out}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  .toast{
    position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;z-index:9;
    font-size:28px;font-weight:800;color:var(--gold);text-shadow:0 4px 20px #000;transition:all .3s;
  }
  .toast.on{opacity:1;transform:translateX(-50%) scale(1)}

  /* over */
  .over{justify-content:center;text-align:center;gap:6px}
  .over .big{font-size:96px;font-weight:800;line-height:1;color:var(--gold)}
  .over .lbl{color:var(--mute);font-size:16px}
  .over .verdict{font-size:24px;font-weight:800;margin:14px 0 4px}
  .over .newbest{color:var(--good);font-weight:700;min-height:22px}
  .reveal{background:var(--card);border-radius:16px;padding:14px;margin:16px 0;font-size:15px;color:var(--mute);line-height:1.4}
  .reveal b{color:var(--ink)}
  .grid{font-size:22px;letter-spacing:2px;margin:6px 0}
  .act{display:grid;gap:10px;margin-top:8px}
  .act .btn{width:100%;font-size:18px}
  .btn.share{background:linear-gradient(90deg,var(--hi),#ff3d8b)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid #ffffff1c}
  .copybox{display:none;width:100%;margin-top:8px;padding:10px;border-radius:12px;background:#0c0816;color:var(--ink);border:1px solid #ffffff22;font:inherit;font-size:13px;resize:none}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section class="screen on" id="home">
    <h1><span class="h">Higher</span><br>or <span class="l">Lower</span></h1>
    <p class="tag">Pick a category. Guess right and keep your streak going.</p>
    <div class="cats" id="cats"></div>
    <p class="foot">Numbers are approximate, from public sources.</p>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <div class="bar">
      <button class="back" id="quit">← Categories</button>
      <div class="scores"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
    </div>
    <div class="stage">
      <div class="card" id="top">
        <div class="emo" id="tEmo"></div>
        <div class="name" id="tName"></div>
        <div class="sub" id="tSub"></div>
        <div class="val" id="tVal"></div>
      </div>
      <div class="vs" id="vs">VS</div>
      <div class="card" id="bot">
        <div class="emo" id="bEmo"></div>
        <div class="name" id="bName"></div>
        <div class="val" id="bVal"></div>
        <div class="q" id="bQ"></div>
        <div class="btns">
          <button class="btn h" id="hiBtn">Higher ▲</button>
          <button class="btn l" id="loBtn">Lower ▼</button>
        </div>
      </div>
    </div>
  </section>

  <!-- GAME OVER -->
  <section class="screen over" id="over">
    <div class="lbl">Your streak</div>
    <div class="big" id="oScore">0</div>
    <div class="verdict" id="oVerdict"></div>
    <div class="newbest" id="oBest"></div>
    <div class="grid" id="oGrid"></div>
    <div class="reveal" id="oReveal"></div>
    <div class="act">
      <button class="btn share" id="shareBtn">Copy result to share</button>
      <textarea class="copybox" id="copybox" rows="4" readonly></textarea>
      <button class="btn h" id="againBtn">Play again</button>
      <button class="btn ghost" id="homeBtn">Change category</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('hol_'+k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem('hol_'+k, JSON.stringify(v)) }catch(e){} }
};
const bests = store.get('bests') || {};

let cat, catKey, deck, left, right, score, locked;

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); }

function renderHome(){
  $('cats').innerHTML = Object.entries(CATS).map(([k,c]) => `
    <button class="cat" data-k="${k}">
      <span class="e">${c.emoji}</span>
      <span><b>${c.title}</b><small>${c.desc}</small></span>
      ${bests[k] ? `<span class="best">🏆 ${bests[k]}</span>` : ''}
    </button>`).join('');
  document.querySelectorAll('.cat').forEach(b => b.onclick = () => start(b.dataset.k));
}

const toItem = a => Array.isArray(a) ? ({ n:a[0], e:a[1], v:a[2], c:a[3] }) : a;
let stat = null;
const M = () => cat.multi ? cat.stats[stat] : cat;
const val = it => cat.multi ? it.s[stat] : it.v;
function pickStat(){
  if(!cat.multi) return;
  const common = Object.keys(cat.stats).filter(k => left.s[k]!=null && right.s[k]!=null);
  let opts = common.filter(k => left.s[k] !== right.s[k]);
  if(!opts.length) opts = common;
  const fresh = opts.filter(k => k !== stat);
  const pool = fresh.length ? fresh : opts;
  stat = pool[Math.random()*pool.length|0];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]] } return a; }
function shares(a,b){ return Object.keys(a.s).some(k => b.s[k]!=null); }
function draw(){
  for(let tries=0; tries<5000; tries++){
    if(!deck.length) deck = shuffle(cat.items.map(toItem));
    const it = deck.pop();
    if(left && it.n === left.n) continue;
    if(left && cat.multi && !shares(left, it)) continue;
    if(left && !cat.multi && it.v === left.v) continue;
    return it;
  }
  return deck.pop() || toItem(cat.items[0]);
}

function start(k){
  catKey = k; cat = CATS[k]; deck = []; left = null; right = null; score = 0; history = []; stat = null;
  left = draw(); right = draw();
  $('score').textContent = 0; $('best').textContent = bests[k] || 0;
  paint(); show('game');
}

function paint(){
  locked = false; pickStat(); const m = M();
  $('hiBtn').textContent = m.hi; $('loBtn').textContent = m.lo;
  $('top').className = 'card'; $('bot').className = 'card slide-in'; $('vs').className = 'vs'; $('vs').textContent = 'VS';
  $('tEmo').textContent = left.e; $('tName').textContent = left.n;
  $('tSub').textContent = cat.multi ? m.label : cat.sub; $('tVal').textContent = m.fmt(val(left), left);
  $('bEmo').textContent = right.e; $('bName').textContent = right.n;
  $('bVal').textContent = ''; $('bVal').style.display = 'none';
  $('bQ').textContent = m.q(left.n); $('bQ').style.display = '';
  $('hiBtn').disabled = $('loBtn').disabled = false;
  document.querySelector('.btns').style.display = '';
}

let history = [];
function guess(higher){
  if(locked) return; locked = true;
  $('hiBtn').disabled = $('loBtn').disabled = true;
  const L = val(left), R = val(right), m = M();
  const ok = R === L || (higher ? R > L : R < L);
  history.push(ok);
  document.querySelector('.btns').style.display = 'none'; $('bQ').style.display = 'none';
  const el = $('bVal'); el.style.display = '';
  const from = cat.from === 'left' ? L : 0, to = R, t0 = performance.now(), dur = 750;
  const isInt = Number.isInteger(to), dec = isInt ? 1 : (cat.multi && stat==='len' ? 100 : 10);
  (function step(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    let v = from + (to-from)*e; v = p<1 ? Math.round(v*dec)/dec : to;
    el.textContent = m.fmt(v, right);
    if(p<1) requestAnimationFrame(step); else finish(ok);
  })(t0);
}

function finish(ok){
  $('bot').classList.add(ok?'good':'bad');
  $('vs').classList.add(ok?'good':'bad'); $('vs').textContent = ok ? '✓' : '✗';
  if(navigator.vibrate) try{ navigator.vibrate(ok?20:[60,40,60]) }catch(e){}
  if(ok){
    score++; $('score').textContent = score; $('score').classList.remove('pop'); void $('score').offsetWidth; $('score').classList.add('pop');
    if(score > (bests[catKey]||0)) $('best').textContent = score;
    const msgs = {3:'🔥 On fire!',5:'⚡ 5 streak!',10:'🧠 Genius!',15:'🚀 Unstoppable',20:'👑 Legend',30:'🤯 Are you cheating?'};
    if(msgs[score]) toast(msgs[score]);
    setTimeout(()=>{ left = right; right = draw(); paint(); }, 900);
  } else {
    setTimeout(gameOver, 1100);
  }
}

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1100); }

function verdict(s){
  return s>=20?'Absolute legend 👑': s>=12?'Big brain energy 🧠': s>=7?'Seriously good 🔥': s>=3?'Not bad! 👍': s>=1?'Warming up… 😅':'Ouch. Run it back 💀';
}
function gridStr(){
  const g = history.slice(-12).map(o=>o?'🟩':'🟥').join('');
  return (history.length>12?'…':'') + g;
}

function gameOver(){
  const prev = bests[catKey]||0, nb = score > prev;
  if(nb){ bests[catKey] = score; store.set('bests', bests); }
  $('oScore').textContent = score; $('oVerdict').textContent = verdict(score);
  $('oBest').textContent = nb && score>0 ? '🏆 New personal best!' : (prev ? `Best: ${prev}` : '');
  $('oGrid').textContent = gridStr();
  const m = M(), lbl = cat.multi ? ` <small>(${m.label})</small>` : '';
  $('oReveal').innerHTML = `<b>${right.n}</b> ${right.e}: <b>${m.fmt(val(right),right)}</b>${lbl}<br>vs <b>${left.n}</b> ${left.e}: <b>${m.fmt(val(left),left)}</b>`;
  $('copybox').style.display='none'; $('shareBtn').textContent='Copy result to share';
  show('over');
}

function shareText(){
  return `${cat.emoji} Higher or Lower: ${cat.title}\nI got a streak of ${score}! ${verdict(score)}\n${gridStr()}\nCan you beat me?`;
}
$('shareBtn').onclick = async () => {
  const txt = shareText();
  try{ await navigator.clipboard.writeText(txt); $('shareBtn').textContent = '✓ Copied! Paste it anywhere'; }
  catch(e){ const b=$('copybox'); b.value=txt; b.style.display='block'; b.select(); $('shareBtn').textContent='Copy the text below'; }
};

$('hiBtn').onclick = () => guess(true);
$('loBtn').onclick = () => guess(false);
$('quit').onclick = () => { renderHome(); show('home'); };
$('againBtn').onclick = () => start(catKey);
$('homeBtn').onclick = () => { renderHome(); show('home'); };
document.addEventListener('keydown', e => {
  if(!$('game').classList.contains('on')) return;
  if(e.key==='ArrowUp') guess(true); if(e.key==='ArrowDown') guess(false);
});
renderHome();
